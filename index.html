<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI-Orakel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">       
        <div class="oracle-info">
            <div class="oracle-message">
                               
                <button id="startOracle" class="btn-oracle">🔮 KI Orakel starten</button>
            </div>
            <div id="oracleProgress" class="oracle-progress" style="display: none;">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <span id="progressText">0 von 5 Fragen</span>
            </div>
        </div>

        <div class="chat-container">
            <div id="chatHistory" class="chat-history"></div>
              <div class="input-section">
                <div class="input-group">                    <textarea id="userInput" placeholder="Geben Sie Ihre Antwort hier ein..." rows="3"></textarea>                    <div class="button-group">
                        <button id="sendChat" class="btn-primary">Antwort senden</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="chatStorage.js"></script>
    <script src="kiOracle.js"></script>
    <script src="script.js"></script>
</body>
</html>
